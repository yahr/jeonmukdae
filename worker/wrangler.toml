name = "jeonmukdae-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "jeonmukdae-db"
database_id = "18a8d01d-17d8-43e4-a501-a0684c84b1a9"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "jeonmukdae-photos"

# 캐릭터 생성 모델: /v1beta/models 목록에서 이미지 출력 모델을 확인하고 고른 값(2026-11-24). 키는 secret GEMINI_API_KEY
[vars]
GEMINI_IMAGE_MODEL = "gemini-3.1-flash-image"
# 구글 로그인 OAuth 클라이언트 ID(공개값). index.html GOOGLE_CLIENT_ID 와 같은 값
GOOGLE_CLIENT_ID = ""

# Gemini API가 일부 지역(Cloudflare 엣지 위치)을 막아서 미국 리전에서 실행(2026-11-24 "User location is not supported" 확인)
[placement]
region = "gcp:us-central1"
